version: 2
updates:
  # npm bağımlılıkları: güvenlik ve sürüm güncellemeleri haftalık taranır.
  # Bugüne kadar zafiyetler (nodemailer, xlsx→exceljs) elle, `npm audit`
  # rastgele çalıştırıldığında fark edilmişti — bu, yeni bir CVE çıktığında
  # kimsenin push beklemeden haberdar olmasını sağlar.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      # Minor/patch runtime updates land together; majors still get their own
      # PR so breaking changes are reviewed one at a time.
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # CI workflow'undaki actions/checkout, actions/setup-node gibi eylemler de
  # kendi başına bir tedarik zinciri riski taşır.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
